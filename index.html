<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Mon Budget</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e7eb;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--ink:#e5e7eb;--mut:#94a3b8;--line:#263041;--acc:#60a5fa;--soft:#1c2536}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
#sync{font-size:12px;color:var(--mut)}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-1px;margin:4px 0}
.hero .sub{opacity:.9;font-size:13px}
.hero.over{background:linear-gradient(135deg,#7f1d1d,#dc2626)}
.bar{height:8px;border-radius:8px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--acc)}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar>i{background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.mini{background:var(--card);border-radius:14px;padding:12px}
.mini .k{font-size:12px;color:var(--mut)}.mini .v{font-size:18px;font-weight:650;margin-top:2px}
h2{font-size:15px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input.amt{font-size:28px;font-weight:650;text-align:center;padding:12px}
button.pri{width:100%;border:0;border-radius:12px;padding:14px;background:var(--acc);color:#fff;font:600 16px inherit;font-family:inherit}
button.pri:disabled{opacity:.4}
button.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0}.list .t small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .a{font-weight:600;white-space:nowrap}
.x{border:0;background:transparent;color:var(--mut);font-size:20px;padding:0 4px}
.cat{margin:10px 0}.cat .h{display:flex;justify-content:space-between;font-size:13px}.cat .h span:last-child{color:var(--mut)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tip{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.tip:first-of-type{border-top:0}
.tip b{display:block}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:17px;text-transform:capitalize}
.days{width:100%;border-collapse:collapse;font-size:13px}
.days td,.days th{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
.days th{color:var(--mut);font-weight:500;border-top:0}
.days td:first-child,.days th:first-child{text-align:left}
.days tr.today td{background:var(--soft)}
.fx{display:grid;grid-template-columns:20px 1fr 70px 76px 20px;gap:6px;align-items:center;margin:6px 0}
.fx input,.fx select{padding:8px;font-size:14px}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{border:0;background:transparent;color:var(--mut);font-size:12px;line-height:1;padding:2px 0}.mv button:disabled{opacity:.25}
.fxg{display:grid;grid-template-columns:20px 1fr 70px 76px 20px;gap:4px 6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.fxg .mv,.fxg .x{grid-row:span 2}.fxg .grp{grid-column:2/5;padding:4px 8px;font-size:12px;color:var(--mut);background:transparent}.fxg input,.fxg select{padding:8px;font-size:14px}
.ghd{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 2px;font-weight:600;font-size:14px}.ghd span:last-child{color:var(--mut);font-weight:500;font-size:13px}
.sortsel{width:auto;padding:6px 8px;font-size:13px}
.tot{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px 0 12px;font:500 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:8px 0}
</style>
</head>
<body>
<header><h1 id="title">Aujourd'hui</h1><span id="sync">…</span></header>
<main>
  <section id="v-today" class="on"></section>
  <section id="v-month"></section>
  <section id="v-budget"></section>
</main>
<nav class="tabs">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
  <button data-v="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mois</button>
  <button data-v="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Budget</button>
</nav>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const PALETTE=["#16a34a","#d97706","#2563eb","#9333ea","#db2777","#0d9488","#dc2626","#4f46e5","#ca8a04","#64748b"];
const DEFAULT_CATS=[
  {k:"alim",n:"Alimentation",c:"#16a34a"},
  {k:"carb",n:"Carburant",c:"#d97706"},
  {k:"cour",n:"Dépenses courantes",c:"#2563eb"},
  {k:"extra",n:"Extras",c:"#9333ea"}
];
let CATS=DEFAULT_CATS;
function syncCats(){if(!Array.isArray(cfg.cats)||!cfg.cats.length)cfg.cats=DEFAULT_CATS.map(c=>Object.assign({},c));CATS=cfg.cats;if(!cfg.vars)cfg.vars={};if(!CATS.some(c=>c.k===selCat))selCat=CATS[0].k;(cfg.fixes||[]).forEach(x=>{if(!FGROUPS.includes(x.g))x.g=guessGroup(x.n)})}
const FGROUPS=["Logement","Crédits","Assurances","Énergie & eau","Abonnements","Transport","Impôts","Autres"];
function guessGroup(n){n=(n||"").toLowerCase();
  if(n.includes("crédit")||n.includes("credit")||n.includes("prêt")||n.includes("emprunt"))return "Crédits";
  if(n.includes("assurance")||n.includes("mutuelle"))return "Assurances";
  if(n.includes("électricité")||n.includes("electricite")||n.includes("eau")||n.includes("gaz"))return "Énergie & eau";
  if(n.includes("mobile")||n.includes("internet")||n.includes("abonnement")||n.includes("box"))return "Abonnements";
  if(n.includes("impôt")||n.includes("impot")||n.includes("taxe"))return "Impôts";
  if(n.includes("loyer")||n.includes("charges")||n.includes("copro"))return "Logement";
  return "Autres"}
const FREQ={m:{n:"/ mois",f:1},t:{n:"/ trim.",f:1/3},s:{n:"/ sem.",f:1/6},a:{n:"/ an",f:1/12}};
const DEFAULT_FIXES=[
  ["Crédit maison","m"],["Crédit conso","m"],["Assurance maison","m"],["Assurance voiture","m"],
  ["Assurance moto","m"],["Abonnement mobile","m"],["Internet fixe","m"],["Électricité","m"],
  ["Eau","m"],["Impôt sur le revenu","m"],["Taxe foncière","a"]
];
function uid(){return Math.random().toString(36).slice(2,10)}
function defaultCfg(){return{cats:DEFAULT_CATS.map(c=>Object.assign({},c)),revenu:0,fixes:DEFAULT_FIXES.map(([n,f])=>({id:uid(),n,a:0,f,g:guessGroup(n)})),vars:{alim:0,carb:0,cour:0,extra:0}}}
const eur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const eur0=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const E=v=>eur.format(v||0), E0=v=>eur0.format(Math.round(v||0));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
function todayKey(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
const mKeyOf=dk=>dk.slice(0,7);
function num(v){const x=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(x)?x:0}

// ---------- state ----------
let cfg=defaultCfg();
const months={};           // "YYYY-MM" -> items [{id,d,c,a,n}]
let viewMonth=mKeyOf(todayKey());
let selCat="alim";
let view="today";
let sortBy="date-desc";
try{sortBy=localStorage.getItem("budget-sort")||sortBy}catch(e){}

// ---------- storage ----------
let mode="local", db=null, uidUser=null;
const subs={};
const queues={};
function lsGet(){try{return JSON.parse(localStorage.getItem("budget-v1")||"null")}catch(e){return null}}
function lsSave(){try{localStorage.setItem("budget-v1",JSON.stringify({cfg,months}))}catch(e){}}
function setSync(t){document.getElementById("sync").textContent=t}
function queuedSet(ref,data){
  const p=ref.path;const prev=queues[p]||Promise.resolve();
  const next=prev.catch(()=>{}).then(()=>ref.set(data));
  queues[p]=next;
  setSync("Enregistrement…");
  next.then(()=>setSync("Synchronisé"),e=>{setSync("Erreur d'enregistrement");toast("Impossible d'enregistrer ("+(e&&e.code||"erreur")+")")});
  return next;
}
let cfgTimer=null;
function saveCfg(){
  if(mode==="local"){lsSave();return}
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(()=>queuedSet(db.doc("data/users/"+uidUser+"/config"),JSON.parse(JSON.stringify(cfg))),700);
}
function saveMonth(mk){
  if(mode==="local"){lsSave();return}
  queuedSet(db.doc("data/users/"+uidUser+"/m-"+mk),{items:months[mk]||[]});
}
function watchMonth(mk){
  if(mode!=="remote"||subs[mk])return;
  subs[mk]=db.doc("data/users/"+uidUser+"/m-"+mk).onSnapshot(s=>{
    const d=s.exists?s.data():null;
    months[mk]=d&&Array.isArray(d.items)?d.items.map(x=>Object.assign({},x)):[];
    render();
  },e=>{setSync("Hors ligne")});
}
async function initStore(){
  const ls=lsGet();
  if(ls){if(ls.cfg)cfg=ls.cfg;if(ls.months)Object.assign(months,ls.months)}
  setSync("Sur ce téléphone");
  render();
  return;
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=u?await u.id():null;
    if(!d||!id){setSync("Sur cet appareil");return}
    db=d;uidUser=id;mode="remote";setSync("Connexion…");
    let loaded=false;
    const timer=setTimeout(()=>{if(!loaded)setSync("Données injoignables pour l'instant")},10000);
    db.doc("data/users/"+uidUser+"/config").onSnapshot(s=>{
      if(!s.metadata.fromCache){loaded=true;clearTimeout(timer);setSync("Synchronisé")}
      if(s.exists){
        const c=s.data();
        cfg={cats:Array.isArray(c.cats)?c.cats.map(x=>Object.assign({},x)):null,start:typeof c.start==="string"?c.start:null,revenu:+c.revenu||0,fixes:Array.isArray(c.fixes)?c.fixes.map(x=>Object.assign({},x)):[],vars:Object.assign({alim:0,carb:0,cour:0,extra:0},c.vars||{})};
      }else if(!s.metadata.fromCache && ls && ls.cfg){
        // first remote use: migrate what was saved locally
        cfg=ls.cfg;saveCfg();
      }
      render(true);
    },e=>{loaded=true;clearTimeout(timer);setSync("Hors ligne")});
    watchMonth(mKeyOf(todayKey()));
    if(viewMonth!==mKeyOf(todayKey()))watchMonth(viewMonth);
  }catch(e){setSync("Sur cet appareil")}
}

// ---------- calculations ----------
const fixedMonthly=()=>cfg.fixes.reduce((s,x)=>s+num(x.a)*(FREQ[x.f]?FREQ[x.f].f:1),0);
const varBudget=()=>CATS.reduce((s,c)=>s+num(cfg.vars[c.k]),0);
function stats(mk){
  const [y,m]=mk.split("-").map(Number);
  const dim=new Date(y,m,0).getDate();
  const items=months[mk]||[];
  const byDay=new Array(dim+1).fill(0), byCat={};
  items.forEach(it=>{const d=+it.d.slice(8,10);if(d>=1&&d<=dim)byDay[d]+=num(it.a);byCat[it.c]=(byCat[it.c]||0)+num(it.a)});
  const tk=todayKey(),cur=mKeyOf(tk);
  // month in which the user started: budget prorated from the start day
  let sd=1; if(cfg.start&&mKeyOf(cfg.start)===mk) sd=+cfg.start.slice(8,10);
  const span=dim-sd+1, factor=span/dim;
  const vb=varBudget()*factor;let cum=0;const days=[];
  for(let d=1;d<=dim;d++){if(d<sd){days.push({d,spent:byDay[d],allow:0,before:0,off:true});continue}const allow=Math.max(0,(vb-cum)/(dim-d+1));days.push({d,spent:byDay[d],allow,before:cum});cum+=byDay[d]}
  let today= mk===cur? +tk.slice(8,10) : (mk<cur? dim+1 : 0);
  const elapsed=Math.min(span,Math.max(0,Math.min(dim,today)-sd+1));
  const ratio=span>0?elapsed/span:0;
  const proj= elapsed>0 ? (mk===cur? cum/elapsed*span : cum) : 0;
  let streak=0; if(mk===cur){for(let d=today-1;d>=sd;d--){const x=days[d-1];if(x.spent<=x.allow+0.005)streak++;else break}}
  return{dim,days,total:cum,byCat,today,elapsed,proj,vb,items,streak,factor,ratio,span,sd};
}

// ---------- render ----------
function catOf(k){return CATS.find(c=>c.k===k)||{n:"Catégorie supprimée",c:"#888"}}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):(a>0?100:0)}
function frDate(dk,opt){const [y,m,d]=dk.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("fr-FR",opt||{weekday:"long",day:"numeric",month:"long"})}

function renderToday(){
  const tk=todayKey(),mk=mKeyOf(tk),st=stats(mk);
  const td=st.days[st.today-1]||{spent:0,allow:0,before:0};
  const left=td.allow-td.spent;
  const daysLeftAfter=st.dim-st.today;
  const tomorrow=daysLeftAfter>0?Math.max(0,(st.vb-td.before-td.spent)/daysLeftAfter):0;
  const todayItems=st.items.filter(i=>i.d===tk).slice().reverse();
  const noBudget=st.vb<=0;
  let h="";
  h+=`<div class="card hero ${left<0?"over":""}">
    <div class="lbl">${esc(frDate(tk))}</div>
    <div class="lbl" style="margin-top:6px">${left>=0?"Tu peux encore dépenser aujourd'hui":"Dépassement du budget du jour"}</div>
    <div class="big">${E(Math.abs(left))}</div>
    <div class="sub">Budget du jour : ${E(td.allow)} · dépensé : ${E(td.spent)}</div>
    <div class="bar"><i style="width:${pct(td.spent,td.allow)}%"></i></div>
  </div>`;
  if(noBudget)h+=`<div class="card"><b>Commence par ton budget</b><div class="mut" style="margin-top:4px">Renseigne tes revenus, tes charges fixes et tes budgets variables (alimentation, carburant…) dans l'onglet Budget. Le montant du jour se calcule ensuite tout seul.</div><div style="margin-top:10px"><button class="ghost" data-go="budget">Ouvrir Budget</button></div></div>`;
  h+=`<div class="row" style="margin-bottom:12px">
    <div class="mini"><div class="k">Demain, si tu t'arrêtes là</div><div class="v">${daysLeftAfter>0?E(tomorrow):"—"}</div></div>
    <div class="mini"><div class="k">Série dans le budget</div><div class="v">${st.streak} jour${st.streak>1?"s":""}</div></div>
  </div>`;
  h+=`<div class="card"><h2>Ajouter une dépense</h2>
    <input id="amt" class="amt" inputmode="decimal" placeholder="0,00 €" autocomplete="off">
    <div class="chips">${CATS.map(c=>`<button class="chip ${c.k===selCat?"on":""}" data-cat="${c.k}"><span class="dot" style="background:${c.c}"></span>${esc(c.n)}</button>`).join("")}</div>
    <div class="row" style="margin-bottom:10px"><input id="note" placeholder="Note (facultatif)" maxlength="60"><input id="dt" type="date" value="${tk}" style="flex:0 0 150px"></div>
    <button class="pri" id="add">Ajouter</button>
  </div>`;
  h+=`<div class="card"><h2>Dépenses du jour</h2>`+(todayItems.length?`<ul class="list">${todayItems.map(it=>{const c=catOf(it.c);return`<li><span class="dot" style="background:${c.c}"></span><div class="t">${esc(c.n)}<small>${esc(it.n||"")}</small></div><span class="a">${E(it.a)}</span><button class="x" data-del="${esc(it.id)}" data-m="${mk}" aria-label="Supprimer">×</button></li>`}).join("")}</ul>`:`<div class="empty">Aucune dépense aujourd'hui.</div>`)+`</div>`;
  h+=`<div class="card"><h2>Rythme par catégorie</h2>${CATS.map(c=>{const b=num(cfg.vars[c.k])*st.factor,s=st.byCat[c.k]||0,exp=b*st.ratio;const cls=s>b?"bad":(s>exp*1.05?"warn":"ok");return`<div class="cat"><div class="h"><span><span class="dot" style="background:${c.c}"></span> ${esc(c.n)}</span><span><b class="${cls}">${E0(s)}</b> / ${E0(b)}</span></div><div class="bar"><i style="width:${pct(s,b)}%;background:${c.c}"></i></div></div>`}).join("")}<div class="mut" style="font-size:12px;margin-top:6px">Orange : en avance sur le rythme normal du mois. Rouge : budget du mois dépassé.</div></div>`;
  document.getElementById("v-today").innerHTML=h;
}

function tipsFor(st){
  const t=[];const rev=num(cfg.revenu),fx=fixedMonthly();
  if(st.vb>0&&st.elapsed>0&&st.elapsed<st.span&&st.proj>st.vb){
    const over=st.proj-st.vb, dl=st.span-st.elapsed;
    t.push(["À ce rythme, dépassement de "+E0(over),"Réduis tes dépenses d'environ "+E(over/dl)+" par jour jusqu'à la fin du mois pour revenir dans les clous."]);
  }
  CATS.forEach(c=>{const b=num(cfg.vars[c.k])*st.factor,s=st.byCat[c.k]||0,dl=st.span-st.elapsed;if(b>0&&st.elapsed>0&&dl>0){const exp=b*st.ratio;if(s>exp*1.15&&s-exp>5)t.push([c.n+" : "+E0(s-exp)+" au-dessus du rythme","Il reste "+E0(Math.max(0,b-s))+" pour "+dl+" jours, soit "+E(Math.max(0,b-s)/dl)+" par jour."])}});
  if(rev>0&&fx/rev>0.5)t.push(["Charges fixes = "+Math.round(fx/rev*100)+" % des revenus","Au-delà de 50 %, la marge de manœuvre devient faible : ce sont les charges fixes qu'il faut renégocier en priorité."]);
  const get=n=>cfg.fixes.filter(x=>x.n.toLowerCase().includes(n)).reduce((s,x)=>s+num(x.a)*(FREQ[x.f]?FREQ[x.f].f:1),0);
  if(get("assurance")>0)t.push(["Assurances auto, moto, habitation","Après un an de contrat, elles se résilient à tout moment : faire jouer la concurrence une fois par an, ou regrouper chez un seul assureur, fait souvent baisser la facture."]);
  if(get("crédit maison")>0)t.push(["Assurance de ton crédit immobilier","L'assurance emprunteur peut être changée à tout moment (loi Lemoine) : un devis en délégation peut réduire nettement son coût."]);
  if(get("mobile")+get("internet")>50)t.push(["Mobile + internet > "+E0(50)+"/mois","Les forfaits sans engagement et les offres box à prix d'appel permettent souvent de diviser la note."]);
  if(get("électricité")>0)t.push(["Électricité","Comparer ton offre au tarif réglementé et vérifier la puissance souscrite de ton compteur."]);
  if(st.byCat.extra>0&&num(cfg.vars.extra)>0&&st.byCat.extra>=num(cfg.vars.extra))t.push(["Budget extras épuisé","Bascule sur la règle des 48 h : attendre deux jours avant tout achat non prévu."]);
  if(rev>0){const ep=rev-fx-(st.proj||st.vb);t.push([ep>=0?"Épargne prévue ce mois : "+E0(ep):"Budget déficitaire de "+E0(-ep),ep>=0?"Programme un virement automatique de cette somme dès le jour de paie : ce qui n'est pas visible ne se dépense pas.":"Les revenus ne couvrent pas les charges et le budget variable prévu : ajuste les budgets dans l'onglet Budget."])}
  return t;
}

function renderMonth(){
  watchMonth(viewMonth);
  const st=stats(viewMonth),[y,m]=viewMonth.split("-").map(Number);
  const label=new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const rev=num(cfg.revenu),fx=fixedMonthly();
  const isCur=viewMonth===mKeyOf(todayKey());
  let h=`<div class="mnav"><button class="ghost" data-mm="-1" aria-label="Mois précédent">‹</button><b>${esc(label)}</b><button class="ghost" data-mm="1" aria-label="Mois suivant">›</button></div>`;
  h+=`<div class="row" style="margin-bottom:10px"><div class="mini"><div class="k">Dépensé (variable)</div><div class="v">${E0(st.total)}</div></div><div class="mini"><div class="k">Reste sur ${E0(st.vb)}</div><div class="v ${st.vb-st.total<0?"bad":""}">${E0(st.vb-st.total)}</div></div></div>`;
  h+=`<div class="row" style="margin-bottom:12px"><div class="mini"><div class="k">${isCur?"Projection fin de mois":"Total du mois"}</div><div class="v ${st.proj>st.vb&&st.vb>0?"bad":""}">${E0(st.proj)}</div></div><div class="mini"><div class="k">Épargne ${isCur?"prévue":"réalisée"}</div><div class="v">${rev>0?E0(rev-fx-(isCur?st.proj:st.total)):"—"}</div></div></div>`;
  h+=`<div class="card"><h2>Vue d'ensemble</h2><ul class="list">
    <li><div class="t">Revenus nets</div><span class="a">${E(rev)}</span></li>
    <li><div class="t">Charges fixes (équiv. mensuel)</div><span class="a">− ${E(fx)}</span></li>${FGROUPS.map(g=>{const v=cfg.fixes.filter(x=>x.g===g).reduce((t,x)=>t+num(x.a)*(FREQ[x.f]?FREQ[x.f].f:1),0);return v>0?`<li style="padding:4px 0 4px 14px;border-top:0"><div class="t mut" style="font-size:13px">${esc(g)}</div><span class="mut" style="font-size:13px">${E(v)}</span></li>`:""}).join("")}
    <li><div class="t">Budget variable</div><span class="a">− ${E(st.vb)}</span></li>
    <li><div class="t"><b>Reste prévu</b></div><span class="a ${rev-fx-st.vb<0?"bad":"ok"}">${E(rev-fx-st.vb)}</span></li></ul></div>`;
  const tips=tipsFor(st);
  if(tips.length)h+=`<div class="card"><h2>Pistes d'optimisation</h2>${tips.map(([a,b])=>`<div class="tip"><div><b>${esc(a)}</b><span class="mut">${esc(b)}</span></div></div>`).join("")}</div>`;
  h+=`<div class="card"><h2>Par catégorie</h2>${CATS.map(c=>{const b=num(cfg.vars[c.k])*st.factor,s=st.byCat[c.k]||0;return`<div class="cat"><div class="h"><span><span class="dot" style="background:${c.c}"></span> ${esc(c.n)}</span><span><b class="${s>b?"bad":""}">${E0(s)}</b> / ${E0(b)}</span></div><div class="bar"><i style="width:${pct(s,b)}%;background:${c.c}"></i></div></div>`}).join("")}</div>`;
  const shown=st.days.filter(x=>st.today===0?false:!x.off&&x.d<=Math.min(st.dim,st.today)).reverse();
  h+=`<div class="card"><h2>Jour par jour</h2>`+(shown.length?`<table class="days"><tr><th>Jour</th><th>Budget</th><th>Dépensé</th><th>Écart</th></tr>${shown.map(x=>{const dk=viewMonth+"-"+pad(x.d),diff=x.allow-x.spent,isT=isCur&&x.d===st.today;return`<tr class="${isT?"today":""}"><td>${esc(frDate(dk,{weekday:"short",day:"numeric"}))}</td><td>${E0(x.allow)}</td><td>${x.spent?E(x.spent):"—"}</td><td class="${diff<0?"bad":"ok"}">${diff>=0?"+":""}${E0(diff)}</td></tr>`}).join("")}</table><div class="mut" style="font-size:12px;margin-top:8px">Le budget de chaque jour = ce qui reste du budget variable ÷ jours restants. Une journée économe augmente les suivantes, un excès les réduit.</div>`:`<div class="empty">Pas encore de jours écoulés ce mois-ci.</div>`)+`</div>`;
  const SORTS={"date-desc":["Plus récentes",(a,b)=>b.d.localeCompare(a.d)],"date-asc":["Plus anciennes",(a,b)=>a.d.localeCompare(b.d)],"amt-desc":["Montant ↓",(a,b)=>num(b.a)-num(a.a)],"amt-asc":["Montant ↑",(a,b)=>num(a.a)-num(b.a)],"cat":["Catégorie",(a,b)=>CATS.findIndex(c=>c.k===a.c)-CATS.findIndex(c=>c.k===b.c)||b.d.localeCompare(a.d)]};
  if(!SORTS[sortBy])sortBy="date-desc";
  const items=st.items.slice().sort(SORTS[sortBy][1]);
  if(items.length)h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Toutes les dépenses (${items.length})</h2><select id="sortsel" class="sortsel">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${k===sortBy?"selected":""}>${v[0]}</option>`).join("")}</select></div><ul class="list">${items.map(it=>{const c=catOf(it.c);return`<li><span class="dot" style="background:${c.c}"></span><div class="t">${esc(c.n)}<small>${esc(frDate(it.d,{day:"numeric",month:"short"}))}${it.n?" · "+esc(it.n):""}</small></div><span class="a">${E(it.a)}</span><button class="x" data-del="${esc(it.id)}" data-m="${viewMonth}" aria-label="Supprimer">×</button></li>`}).join("")}</ul></div>`;
  document.getElementById("v-month").innerHTML=h;
}

function renderBudget(){
  syncCats();
  const fx=fixedMonthly(),vb=varBudget(),rev=num(cfg.revenu);
  let h=`<div class="card"><h2>Revenus mensuels nets</h2><input data-f="revenu" inputmode="decimal" value="${cfg.revenu||""}" placeholder="0 €"></div>`;
  h+=`<div class="card"><h2>Charges fixes</h2><div class="mut" style="font-size:12px;margin-bottom:6px">Montant tel que prélevé, et sa fréquence : l'appli calcule l'équivalent mensuel.</div>
    ${FGROUPS.filter(g=>cfg.fixes.some(x=>x.g===g)).map(g=>{const list=cfg.fixes.filter(x=>x.g===g);const sub=list.reduce((t,x)=>t+num(x.a)*(FREQ[x.f]?FREQ[x.f].f:1),0);
      return `<div class="ghd"><span>${esc(g)}</span><span>${E(sub)} / mois</span></div>`+list.map((x,i)=>`<div class="fxg"><span class="mv"><button data-mvfx="${esc(x.id)}" data-dir="-1" ${i===0?"disabled":""} aria-label="Monter">▲</button><button data-mvfx="${esc(x.id)}" data-dir="1" ${i===list.length-1?"disabled":""} aria-label="Descendre">▼</button></span><input data-fx="${esc(x.id)}" data-k="n" value="${esc(x.n)}"><input data-fx="${esc(x.id)}" data-k="a" inputmode="decimal" value="${x.a||""}" placeholder="0 €"><select data-fx="${esc(x.id)}" data-k="f">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}" ${x.f===k?"selected":""}>${v.n}</option>`).join("")}</select><button class="x" data-rmfx="${esc(x.id)}" aria-label="Supprimer">×</button><select class="grp" data-fx="${esc(x.id)}" data-k="g" aria-label="Catégorie">${FGROUPS.map(o=>`<option ${o===x.g?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`).join("")}).join("")}
    <button class="ghost" id="addfx" style="margin-top:6px">+ Ajouter une charge</button>
    <div class="tot"><span>Total mensuel</span><span id="fxtot">${E(fx)}</span></div></div>`;
  h+=`<div class="card"><h2>Catégories de dépenses</h2><div class="mut" style="font-size:12px;margin-bottom:6px">Nom et budget mensuel de chaque catégorie. Tu peux en ajouter, les renommer, les réordonner.</div>${CATS.map((c,i)=>`<div class="fx" style="grid-template-columns:20px 1fr 90px 20px"><span class="mv"><button data-mvcat="${i}" data-dir="-1" ${i===0?"disabled":""} aria-label="Monter">▲</button><button data-mvcat="${i}" data-dir="1" ${i===CATS.length-1?"disabled":""} aria-label="Descendre">▼</button></span><input data-catn="${esc(c.k)}" value="${esc(c.n)}" maxlength="30" style="border-left:5px solid ${c.c}"><input data-v="${esc(c.k)}" inputmode="decimal" value="${cfg.vars[c.k]||""}" placeholder="0 €"><button class="x" data-rmcat="${esc(c.k)}" aria-label="Supprimer">×</button></div>`).join("")}
    <button class="ghost" id="addcat" style="margin-top:6px">+ Ajouter une catégorie</button>
    <div class="tot"><span>Total variable</span><span id="vbtot">${E(vb)}</span></div>
    <div class="mut" style="font-size:12px;margin-top:6px">Soit environ <span id="perday">${E(vb/30.4)}</span> par jour en moyenne.</div></div>`;
  h+=`<div class="card"><div class="tot" style="border:0;margin:0;padding:0"><span>Reste après charges et budget</span><span id="resttot" class="${rev-fx-vb<0?"bad":"ok"}">${E(rev-fx-vb)}</span></div></div>`;
  h+=`<div class="card"><h2>Sauvegarde</h2><div class="mut" style="font-size:13px;margin-bottom:10px">Tes données restent uniquement sur ce téléphone. Exporte une sauvegarde de temps en temps (dans Fichiers ou iCloud Drive) pour pouvoir les restaurer.</div><div class="row"><button class="ghost" id="exp">Exporter</button><label class="ghost" style="text-align:center;display:block;padding:8px 12px;border:1px solid var(--line);border-radius:10px">Importer<input type="file" id="imp" accept="application/json,.json" style="display:none"></label></div></div>`;
  document.getElementById("v-budget").innerHTML=h;
}
function refreshBudgetTotals(){
  const fx=fixedMonthly(),vb=varBudget(),rev=num(cfg.revenu);
  const s=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  s("fxtot",E(fx));s("vbtot",E(vb));s("perday",E(vb/30.4));
  const r=document.getElementById("resttot");if(r){r.textContent=E(rev-fx-vb);r.className=rev-fx-vb<0?"bad":"ok"}
}

function render(fromCfg){
  syncCats();
  const keepToday=view==="today"&&document.activeElement&&["amt","note","dt"].includes(document.activeElement.id);
  if(!keepToday){
    const a=document.getElementById("amt"),n=document.getElementById("note"),d=document.getElementById("dt");
    const saved=a?{a:a.value,n:n.value,d:d.value}:null;
    renderToday();
    if(saved){document.getElementById("amt").value=saved.a;document.getElementById("note").value=saved.n;document.getElementById("dt").value=saved.d||todayKey()}
  }
  renderMonth();
  const vb=document.getElementById("v-budget");
  if(!(vb.contains(document.activeElement))&&(fromCfg||!vb.innerHTML))renderBudget();
}

// ---------- events ----------
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1800)}
function show(v){
  view=v;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.getElementById("title").textContent={today:"Aujourd'hui",month:"Mon mois",budget:"Mon budget"}[v];
  if(v==="budget")renderBudget(); else render();
  window.scrollTo(0,0);
}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)});
function addExpense(){
  const a=num(document.getElementById("amt").value);
  if(!(a>0)){toast("Saisis un montant");return}
  const d=document.getElementById("dt").value||todayKey();
  const mk=mKeyOf(d);
  watchMonth(mk);
  months[mk]=(months[mk]||[]).concat([{id:uid(),d,c:selCat,a:Math.round(a*100)/100,n:document.getElementById("note").value.trim().slice(0,60)}]);
  saveMonth(mk);
  document.getElementById("amt").value="";document.getElementById("note").value="";
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  render();toast(E(a)+" ajouté");
}
document.addEventListener("click",e=>{
  const t=e.target;
  const cat=t.closest("[data-cat]");
  if(cat){selCat=cat.dataset.cat;document.querySelectorAll("[data-cat]").forEach(c=>c.classList.toggle("on",c.dataset.cat===selCat));return}
  if(t.id==="add"){addExpense();return}
  const del=t.closest("[data-del]");
  if(del){const mk=del.dataset.m;months[mk]=(months[mk]||[]).filter(i=>i.id!==del.dataset.del);saveMonth(mk);render();toast("Dépense supprimée");return}
  const mm=t.closest("[data-mm]");
  if(mm){let [y,m]=viewMonth.split("-").map(Number);m+=+mm.dataset.mm;if(m<1){m=12;y--}if(m>12){m=1;y++}viewMonth=y+"-"+pad(m);renderMonth();return}
  const go=t.closest("[data-go]");if(go){show(go.dataset.go);return}
  const mc=t.closest("[data-mvcat]");
  if(mc){const i=+mc.dataset.mvcat,j=i+(+mc.dataset.dir),a=cfg.cats;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];saveCfg();renderBudget();render()}return}
  if(t.id==="addcat"){const used=cfg.cats.map(c=>c.c);const col=PALETTE.find(c=>!used.includes(c))||PALETTE[cfg.cats.length%PALETTE.length];const k="c"+uid();cfg.cats.push({k,n:"Nouvelle catégorie",c:col});cfg.vars[k]=0;saveCfg();renderBudget();render();const el=document.querySelector('[data-catn="'+k+'"]');if(el){el.focus();el.select()}return}
  const rc=t.closest("[data-rmcat]");
  if(rc){const k=rc.dataset.rmcat;if(cfg.cats.length<=1){toast("Il faut garder au moins une catégorie");return}
    const used=Object.values(months).some(l=>(l||[]).some(i=>i.c===k));
    if(used&&rc.dataset.arm!=="1"){rc.dataset.arm="1";rc.style.color="var(--bad)";toast("Cette catégorie a des dépenses : touche encore × pour confirmer");setTimeout(()=>{rc.dataset.arm="";rc.style.color=""},4000);return}
    cfg.cats=cfg.cats.filter(c=>c.k!==k);delete cfg.vars[k];syncCats();saveCfg();renderBudget();render();return}
  const mv=t.closest("[data-mvfx]");
  if(mv){const a=cfg.fixes,x=a.find(f=>f.id===mv.dataset.mvfx);if(!x)return;const same=a.filter(f=>f.g===x.g),k=same.indexOf(x)+(+mv.dataset.dir);if(k>=0&&k<same.length){const i=a.indexOf(x),j=a.indexOf(same[k]);[a[i],a[j]]=[a[j],a[i]];saveCfg();renderBudget()}return}
  if(t.id==="addfx"){cfg.fixes.push({id:uid(),n:"Nouvelle charge",a:0,f:"m",g:"Autres"});saveCfg();renderBudget();return}
  const rm=t.closest("[data-rmfx]");
  if(rm){cfg.fixes=cfg.fixes.filter(x=>x.id!==rm.dataset.rmfx);saveCfg();renderBudget();render();return}
});
document.addEventListener("click",e=>{
  if(e.target.id!=="exp")return;
  const blob=new Blob([JSON.stringify({app:"mon-budget",v:1,cfg,months},null,1)],{type:"application/json"});
  const name="budget-"+todayKey()+".json";
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
});
document.addEventListener("change",e=>{
  if(e.target.id!=="imp"||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.cfg||!d.months)throw 0;
    cfg=d.cfg;Object.keys(months).forEach(k=>delete months[k]);Object.assign(months,d.months);lsSave();renderBudget();render();toast("Sauvegarde restaurée")}
    catch(x){toast("Fichier de sauvegarde invalide")}};
  r.readAsText(e.target.files[0]);e.target.value="";
});
document.getElementById("v-month").addEventListener("change",e=>{if(e.target.id==="sortsel"){sortBy=e.target.value;try{localStorage.setItem("budget-sort",sortBy)}catch(x){}renderMonth()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="amt"||e.target.id==="note")){e.preventDefault();addExpense()}});
document.getElementById("v-budget").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f==="revenu")cfg.revenu=num(t.value);
  else if(t.dataset.v)cfg.vars[t.dataset.v]=num(t.value);
  else if(t.dataset.catn){const c=cfg.cats.find(x=>x.k===t.dataset.catn);if(!c)return;c.n=t.value.slice(0,30)||"Sans nom"}
  else if(t.dataset.fx){const x=cfg.fixes.find(f=>f.id===t.dataset.fx);if(!x)return;if(t.dataset.k==="a")x.a=num(t.value);else if(t.dataset.k==="n")x.n=t.value.slice(0,40);else if(t.dataset.k==="g"){x.g=t.value;saveCfg();renderBudget();return}else x.f=t.value}
  else return;
  if(!cfg.start)cfg.start=todayKey();
  refreshBudgetTotals();saveCfg();
  renderToday();renderMonth();
});
document.getElementById("v-budget").addEventListener("change",e=>{if(e.target.tagName==="SELECT"){/* handled by input */}});
// refresh at midnight / when app comes back to foreground
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
setInterval(()=>{const k=todayKey();if(k!==render._k){render._k=k;render()}},60000);render._k=todayKey();

initStore();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
